<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Asistencia Fundesteam</title>
    <style>
        /* Reseteo básico */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            background-color: #f4f6f9; /* Color de fondo del área de contenido */
        }

        /* Contenedor principal para dividir sidebar y contenido */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- BARRA LATERAL (SIDEBAR) --- */
        .sidebar {
            width: 250px;
            background-color: #2b2b2c; /* Gris muy oscuro basado en el diseño */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* Cabecera del Sidebar (Logo) */
        .sidebar-header {
            background-color: #0095D3; /* Azul Fundesteam */
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sidebar-header .icon {
            margin-right: 10px;
            font-size: 20px;
        }

        /* Menú del Sidebar */
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        /* Efecto al pasar el mouse */
        .sidebar-menu a:hover {
            background-color: #3d3d3f;
            color: #ffffff;
        }

        /* Elemento Activo (Pestaña actual) */
        .sidebar-menu li.active a {
            background-color: #4a4a4c; /* Fondo gris más claro para resaltar */
            color: #ffffff;
            border-left: 4px solid #0095D3; /* Línea azul Fundesteam */
        }

        .sidebar-menu .icon {
            margin-right: 15px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* --- ÁREA PRINCIPAL --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* --- BARRA SUPERIOR (TOPBAR) --- */
        .topbar {
            height: 60px;
            background-color: #1a1a1b; /* Negro/Gris súper oscuro */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #ffffff;
        }

        .topbar-left {
            display: flex;
            align-items: center;
        }

        /* Botón de hamburguesa */
        .menu-toggle {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            margin-right: 15px;
        }

        /* Título de la sección actual */
        .page-title {
            color: #0095D3; /* Azul Fundesteam */
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .topbar-right {
            font-size: 12px;
            color: #b0b0b0;
            letter-spacing: 0.5px;
        }

        .topbar-right span {
            color: #ffffff;
            font-weight: bold;
        }

        /* Espacio para el contenido de la tabla (vacío según instrucciones) */
        .content-area {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="icon">⚙️</span> FUNDESTEAM
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="#"><span class="icon">🏠</span> Inicio</a>
                </li>
                <li>
                    <a href="#"><span class="icon">👥</span> Usuarios</a>
                </li>
                <!-- Pestaña Activa -->
                <li class="active">
                    <a href="#"><span class="icon">📋</span> Asistencia</a>
                </li>
                <li>
                    <a href="#"><span class="icon">🔄</span> Movimientos</a>
                </li>
                <li>
                    <a href="#"><span class="icon">📊</span> Consultas</a>
                </li>
            </ul>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <div class="main-wrapper">
            
            <!-- BARRA SUPERIOR (TOPBAR) -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle">☰</button>
                    <span class="page-title">Asistencia</span>
                </div>
                <div class="topbar-right">
                    BIENVENIDO <span>SAMUEL</span>
                </div>
            </header>

            <!-- ÁREA DE CONTENIDO (Aquí iría la tabla blanca de la imagen) -->
            <main class="content-area">
                <!-- El contenido principal de la tabla va aquí -->
            </main>

        </div>
    </div>

</body>
</html>
